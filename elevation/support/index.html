<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Support — Elevation</title>
<meta name="description" content="Get help with Elevation — questions, bug reports, and feature requests.">
<link rel="canonical" href="https://onelocal.dev/elevation/support/">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/png" href="../images/logo.png">
<link rel="apple-touch-icon" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
  nav { max-width: 42rem; margin: 0 auto; }
  header { padding: 1.5rem 1.5rem 2.5rem; max-width: 42rem; margin: 0 auto; text-align: center; }
  header h1 { font-size: 2.1rem; font-weight: 800; margin: 0 0 0.6rem; letter-spacing: -0.03em; }
  header p { font-size: 1.05rem; color: var(--muted); margin: 0 auto; max-width: 30rem; }
  main { max-width: 42rem; margin: 0 auto; padding: 0 1.5rem 6rem; text-align: center; }
  .mail-button {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    padding: 0.95rem 2.1rem;
    border-radius: 999px;
    margin-top: 0.5rem;
    box-shadow: var(--shadow-md);
    transition: background 0.18s ease, transform 0.18s cubic-bezier(.16,1,.3,1), box-shadow 0.18s ease;
  }
  .mail-button:hover { background: var(--accent-dark); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .email { margin-top: 1rem; font-size: 0.88rem; color: var(--muted); }
  .email a { color: var(--accent-dark); font-weight: 600; }
  .links-row { margin-top: 2.5rem; font-size: 0.88rem; }
  .links-row a { color: var(--muted); text-decoration: underline; margin: 0 0.5rem; }
</style>
</head>
<body>
  <nav>
    <a href="/"><img class="brand-mark" src="/assets/onelocal-mark.svg" alt=""> OneLocal</a>
    <a href="/elevation/">Elevation</a>
    <a href="/elevation/privacy/">Privacy</a>
  </nav>
  <header>
    <h1>Support</h1>
    <p>Questions, bug reports, or an idea for Elevation — we read every email ourselves.</p>
  </header>
  <main>
    <a class="mail-button" href="mailto:support.elevation@onelocal.dev?subject=Elevation%20support">Email support</a>
    <p class="email">Or write to us directly at <a href="mailto:support.elevation@onelocal.dev">support.elevation@onelocal.dev</a></p>
    <div class="links-row">
      <a href="/elevation/">Back to Elevation</a>&middot;<a href="/elevation/privacy/">Privacy Policy</a>
    </div>
  </main>
  <footer>
    &copy; 2026 OneLocal
  </footer>
</body>
</html>
